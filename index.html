<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>Logan — Engineer</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #fff;
      color: #24292f;
      font-family: "ABC Areal Mono", "Areal Mono", ui-monospace, "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      line-height: 1.6;
    }
    main {
      max-width: 720px;
      margin: clamp(40px, 10vh, 96px) auto;
      padding: 0 24px;
    }
    h1 {
      margin: 0 0 24px;
      padding-bottom: 12px;
      border-bottom: 1px solid #d8dee4;
      font-size: clamp(28px, 5vw, 36px);
      font-weight: 600;
      line-height: 1.25;
    }
    h2 {
      margin: 0;
      font-size: 20px;
      font-weight: 400;
      line-height: 1.5;
    }
    .marker { color: #6e7781; }
  </style>
</head>
<body>
  <main>
    <h1><span class="marker" aria-hidden="true"># </span>Logan</h1>
    <h2><span class="marker" aria-hidden="true">## </span>Engineer</h2>
  </main>
</body>
</html>
